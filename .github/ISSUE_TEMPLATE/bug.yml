name: Сообщить об ошибке / Bug report
description: Что-то не работает или работает не так / Something doesn't work or works wrong
labels: ["ошибка"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что пишете! Чем подробнее, тем быстрее получится найти и исправить. Можно писать по-русски или по-английски.
        Не выкладывайте сюда пароли, свой IP-адрес и QR-код сопряжения.

        Thanks for reporting! The more details, the faster it gets fixed. Russian or English is fine.
        Don't post passwords, your IP address or the pairing QR code here.
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что делали, что ожидали увидеть и что произошло на самом деле. / What you did, what you expected and what actually happened.
      placeholder: |
        1. Открыл вкладку «Экран» / Opened the Screen tab
        2. Нажал кнопку звука / Tapped the sound button
        3. Звука нет, хотя на компьютере музыка играет / No sound, though music is playing on the PC
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Где проблема / Where is the problem
      options:
        - Приложение на телефоне / Phone app
        - Программа на компьютере / Windows program
        - Установщик / Installer
        - Не знаю / Not sure
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Как подключены / How you connect
      options:
        - Дома, по Wi-Fi / At home, over Wi-Fi
        - Через интернет (белый IP / DDNS) / Over the internet (public IP / DDNS)
        - Через VPN (Tailscale и т. п.) / Through a VPN (Tailscale etc.)
        - Не подключается вообще / Can't connect at all
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Couchpad / Couchpad version
      description: На телефоне — «Настройки» Android → «Приложения» → Couchpad; на компьютере — «Параметры Windows» → «Приложения» → Couchpad. / Phone — Android Settings → Apps → Couchpad; PC — Windows Settings → Apps → Couchpad.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Телефон и версия Android / Phone and Android version
      placeholder: "Samsung Galaxy A52, Android 14"
  - type: input
    id: windows
    attributes:
      label: Версия Windows / Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: extra
    attributes:
      label: Скриншоты или журнал / Screenshots or log
      description: |
        Можно перетащить сюда картинки. Журнал программы на ПК — файл agent.log в папке %APPDATA%\Couchpad
        (вставьте в адресную строку Проводника). Перед отправкой проверьте, что в нём нет того, чем не хочется делиться.
        You can drag images here. The PC program's log is agent.log in %APPDATA%\Couchpad
        (paste it into the Explorer address bar). Check it for anything you don't want to share before posting.
